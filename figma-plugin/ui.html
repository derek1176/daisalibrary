<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>다이사 디자인시스템 린터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      letter-spacing: -0.01em;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    body {
      background-color: #F8F9FA;
      color: #111827;
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
      user-select: none;
    }

    /* 1. 상단 미니멀 헤더 */
    .app-header {
      background: #FFFFFF;
      padding: 10px 14px;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #111827;
      letter-spacing: -0.02em;
    }

    .brand-version {
      font-size: 10px;
      font-weight: 600;
      color: #6B7280;
      background: #F3F4F6;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* daisalibrary 스타일 세그먼트 모드 전환 */
    .mode-segmented {
      display: flex;
      background: #F1F3F5;
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .mode-item {
      border: none;
      background: transparent;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      color: #6B7280;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .mode-item.active {
      background: #FFFFFF;
      color: #111827;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    /* 2. 컨트롤 바 (선택 레이어 vs 전체 페이지) */
    .control-bar {
      background: #FFFFFF;
      padding: 8px 14px;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }

    .scope-toggle {
      display: flex;
      background: #F3F4F6;
      border-radius: 5px;
      padding: 2px;
      gap: 2px;
    }

    .scope-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: #6B7280;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .scope-btn.active {
      background: #FFFFFF;
      color: #111827;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .btn-icon-refresh {
      width: 28px;
      height: 28px;
      border: 1px solid #E5E7EB;
      background: #FFFFFF;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6B7280;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-icon-refresh:hover {
      background: #F3F4F6;
      color: #111827;
      border-color: #D1D5DB;
    }

    /* 3. 2단 필터 내비게이션 (심각도 필터 & 카테고리 필터) */
    .filter-panel {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    /* 3-1. 심각도 탭 (전체 / 수정 필요 / 확인 필요) */
    .severity-tabs {
      display: flex;
      padding: 0 14px;
      border-bottom: 1px solid #F3F4F6;
      gap: 16px;
    }

    .sev-tab {
      padding: 8px 0;
      border: none;
      background: transparent;
      border-bottom: 2px solid transparent;
      font-size: 12px;
      font-weight: 500;
      color: #6B7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .sev-tab:hover {
      color: #111827;
    }

    .sev-tab.active {
      color: #111827;
      font-weight: 700;
      border-bottom-color: #111827;
    }

    .sev-tab.active.must-fix {
      color: #DC2626;
      border-bottom-color: #DC2626;
    }

    .sev-tab.active.check-needed {
      color: #4B5563;
      border-bottom-color: #4B5563;
    }

    .sev-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 10px;
      background: #F3F4F6;
      color: #6B7280;
    }

    .sev-tab.active .sev-pill {
      background: #111827;
      color: #FFFFFF;
    }

    .sev-tab.active.must-fix .sev-pill {
      background: #FEE2E2;
      color: #DC2626;
    }

    .sev-tab.active.check-needed .sev-pill {
      background: #E5E7EB;
      color: #374151;
    }

    /* 3-2. 카테고리 칩 바 */
    .category-chips {
      display: flex;
      padding: 6px 14px;
      gap: 6px;
      background: #FAFAFA;
      overflow-x: auto;
    }

    .cat-chip {
      padding: 3px 8px;
      border: 1px solid #E5E7EB;
      background: #FFFFFF;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      color: #6B7280;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .cat-chip:hover {
      border-color: #D1D5DB;
      color: #111827;
    }

    .cat-chip.active {
      background: #111827;
      color: #FFFFFF;
      border-color: #111827;
    }

    /* 상단 액션 바 (복제본 생성 / 직접 수정) */
    .summary-bar {
      padding: 7px 14px;
      background: #F8F9FA;
      border-bottom: 1px solid #E5E7EB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }

    .summary-text {
      font-size: 11px;
      color: #6B7280;
      white-space: nowrap;
    }

    .summary-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn-subtle {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-subtle:hover {
      background: #F3F4F6;
      border-color: #D1D5DB;
    }

    .btn-subtle.clone-action {
      color: #1219F7;
      border-color: #C7D2FE;
      background: #EEF2FF;
      font-weight: 600;
    }

    .btn-subtle.clone-action:hover {
      background: #E0E7FF;
    }

    /* 4. 이슈 리스트 스크롤 영역 (스크롤 완벽 지원) */
    .issue-scroll-area {
      flex: 1 1 0px;
      height: 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 14px 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    /* 5. 피드백 그룹 아코디언 카드 (찌그러짐 방지 flex-shrink: 0, min-height 48px) */
    .group-card {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      flex-shrink: 0;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
      box-sizing: border-box;
      transition: border-color 0.15s ease;
    }

    .group-card:hover {
      border-color: #D1D5DB;
    }

    /* 그룹 헤더 */
    .group-header {
      min-height: 48px;
      height: auto;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: #FFFFFF;
      border-radius: 8px;
      transition: background 0.15s ease;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .group-header:hover {
      background: #F9FAFB;
    }

    .group-info-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .badge-severity {
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-severity.must-fix {
      background: #FEF2F2;
      color: #DC2626;
      border: 1px solid #FEE2E2;
    }

    .badge-severity.check-needed {
      background: #F3F4F6;
      color: #4B5563;
      border: 1px solid #E5E7EB;
    }

    .group-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }

    .group-count-tag {
      font-size: 11px;
      font-weight: 600;
      color: #6B7280;
      background: #F3F4F6;
      padding: 2px 7px;
      border-radius: 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .group-actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .btn-group-fix {
      height: 26px;
      padding: 0 8px;
      background: #EEF2FF;
      color: #1219F7;
      border: 1px solid #C7D2FE;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease;
      white-space: nowrap;
    }

    .btn-group-fix:hover {
      background: #E0E7FF;
    }

    .btn-chevron {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6B7280;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.15s ease;
    }

    .btn-chevron.expanded {
      transform: rotate(180deg);
    }

    /* 그룹 하위 레이어 드롭다운 목록 */
    .group-items-list {
      background: #FAFAFA;
      border-top: 1px solid #F3F4F6;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      display: flex;
      flex-direction: column;
    }

    .layer-item-row {
      padding: 9px 12px;
      border-bottom: 1px solid #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .layer-item-row:last-child {
      border-bottom: none;
    }

    .layer-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }

    .layer-name-tag {
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layer-desc {
      font-size: 11px;
      color: #6B7280;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layer-btns {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .btn-mini-locate {
      height: 24px;
      padding: 0 7px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 500;
      color: #4B5563;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .btn-mini-locate:hover {
      background: #F3F4F6;
      border-color: #D1D5DB;
    }

    .btn-mini-fix {
      height: 24px;
      padding: 0 8px;
      background: #1219F7;
      border: none;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      color: #FFFFFF;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .btn-mini-fix:hover {
      background: #0D14D1;
    }

    /* 빈 화면 */
    .empty-state-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      text-align: center;
      color: #6B7280;
    }

    .empty-icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: #6B7280;
    }

    .empty-icon-circle.success {
      background: #EEF2FF;
      color: #1219F7;
    }

    .empty-state-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 4px;
    }

    .empty-state-desc {
      font-size: 11px;
      color: #6B7280;
      line-height: 1.5;
    }

    /* 공통 SVG 아이콘 */
    .svg-icon {
      width: 13px;
      height: 13px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- 1. 미니멀 상단 헤더 -->
  <header class="app-header">
    <div class="brand-wrap">
      <span class="brand-title">daisalibrary</span>
      <span class="brand-version" id="versionTag">고객향</span>
    </div>
    <!-- daisalibrary 스타일 세그먼트 스위처 -->
    <div class="mode-segmented">
      <button class="mode-item active" id="tabCustomer">고객향</button>
      <button class="mode-item" id="tabPartner">파트너향</button>
    </div>
  </header>

  <!-- 2. 컨트롤 바 (실시간 검사: 선택 레이어 vs 전체 페이지) -->
  <div class="control-bar">
    <div class="scope-toggle">
      <button class="scope-btn active" id="btnScopeSelection">선택된 레이어 (실시간)</button>
      <button class="scope-btn" id="btnScopePage">현재 페이지 전체</button>
    </div>
    <button class="btn-icon-refresh" id="btnRefresh" title="새로고침">
      <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    </button>
  </div>

  <!-- 3. 필터 내비게이션 -->
  <div class="filter-panel" id="filterPanel" style="display: none;">
    <!-- 3-1. 심각도 모아보기 (전체 / 수정 필요 / 확인 필요) -->
    <div class="severity-tabs">
      <button class="sev-tab active" data-sev="all">
        <span>전체</span>
        <span class="sev-pill" id="pillAll">0</span>
      </button>
      <button class="sev-tab must-fix" data-sev="must-fix">
        <span>수정 필요</span>
        <span class="sev-pill" id="pillMustFix">0</span>
      </button>
      <button class="sev-tab check-needed" data-sev="check-needed">
        <span>확인 필요</span>
        <span class="sev-pill" id="pillCheckNeeded">0</span>
      </button>
    </div>

    <!-- 3-2. 카테고리 칩 -->
    <div class="category-chips">
      <button class="cat-chip active" data-cat="all">전체</button>
      <button class="cat-chip" data-cat="typography">서체·폰트</button>
      <button class="cat-chip" data-cat="color">컬러</button>
      <button class="cat-chip" data-cat="radius">곡률·보더</button>
      <button class="cat-chip" data-cat="layout">기타</button>
    </div>
  </div>

  <!-- 상단 액션 바 (복제본 생성 / 직접 수정) -->
  <div class="summary-bar" id="summaryBar" style="display: none;">
    <div class="summary-text" id="summarySummaryText">총 0개 항목 발견</div>
    <div class="summary-actions">
      <!-- ★ 원본 보존 & 새 레이어로 완성본 복제 생성 버튼 -->
      <button class="btn-subtle clone-action" id="btnCloneAndFix" title="원본을 그대로 두고, 옆에 자동 수정된 완성본 프레임을 새로 만듭니다.">
        <svg class="svg-icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span>완성본 복제 생성</span>
      </button>

      <!-- 현재 레이어에서 직접 일괄 수정 버튼 -->
      <button class="btn-subtle" id="btnFixAll" style="display: none;">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>직접 수정 (<span id="cntFixableTotal">0</span>)</span>
      </button>
    </div>
  </div>

  <!-- 4. 피드백 그룹 아코디언 리스트 -->
  <main class="issue-scroll-area" id="issueScrollArea">
    <div class="empty-state-box">
      <div class="empty-icon-circle">
        <svg class="svg-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
      </div>
      <div class="empty-state-title">검사할 대상을 선택하세요</div>
      <div class="empty-state-desc">
        피그마 캔버스에서 검증할 프레임을 클릭하면<br>
        버튼을 누르지 않아도 실시간으로 바로 검사합니다.
      </div>
    </div>
  </main>

  <script>
    let currentMode = 'customer';
    let currentScope = 'selection'; // 'selection' | 'page'
    let currentIssues = [];
    let currentSeverity = 'all';
    let currentCategory = 'all';
    let expandedGroupKeys = new Set();

    const tabCustomer = document.getElementById('tabCustomer');
    const tabPartner = document.getElementById('tabPartner');
    const versionTag = document.getElementById('versionTag');
    const btnScopeSelection = document.getElementById('btnScopeSelection');
    const btnScopePage = document.getElementById('btnScopePage');
    const btnRefresh = document.getElementById('btnRefresh');
    const filterPanel = document.getElementById('filterPanel');
    const summaryBar = document.getElementById('summaryBar');
    const summarySummaryText = document.getElementById('summarySummaryText');
    const pillAll = document.getElementById('pillAll');
    const pillMustFix = document.getElementById('pillMustFix');
    const pillCheckNeeded = document.getElementById('pillCheckNeeded');
    const btnCloneAndFix = document.getElementById('btnCloneAndFix');
    const btnFixAll = document.getElementById('btnFixAll');
    const cntFixableTotal = document.getElementById('cntFixableTotal');
    const issueScrollArea = document.getElementById('issueScrollArea');

    // 모드 전환
    tabCustomer.addEventListener('click', () => {
      if (currentMode === 'customer') return;
      currentMode = 'customer';
      tabCustomer.className = 'mode-item active';
      tabPartner.className = 'mode-item';
      versionTag.textContent = '고객향';
      requestLint();
    });

    tabPartner.addEventListener('click', () => {
      if (currentMode === 'partner') return;
      currentMode = 'partner';
      tabCustomer.className = 'mode-item';
      tabPartner.className = 'mode-item active';
      versionTag.textContent = '파트너향';
      requestLint();
    });

    // 스코프 전환 (선택 레이어 vs 전체 페이지)
    btnScopeSelection.addEventListener('click', () => {
      if (currentScope === 'selection') return;
      currentScope = 'selection';
      btnScopeSelection.className = 'scope-btn active';
      btnScopePage.className = 'scope-btn';
      requestLint();
    });

    btnScopePage.addEventListener('click', () => {
      if (currentScope === 'page') return;
      currentScope = 'page';
      btnScopeSelection.className = 'scope-btn';
      btnScopePage.className = 'scope-btn active';
      requestLint();
    });

    btnRefresh.addEventListener('click', () => {
      requestLint();
    });

    function requestLint() {
      parent.postMessage({
        pluginMessage: {
          type: 'run-lint',
          mode: currentMode,
          scope: currentScope,
          ignoreHidden: true
        }
      }, '*');
    }

    // 심각도 탭 전환
    document.querySelectorAll('.sev-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sev-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentSeverity = tab.dataset.sev;
        renderGroups();
      });
    });

    // 카테고리 칩 전환
    document.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentCategory = chip.dataset.cat;
        renderGroups();
      });
    });

    // 피그마 통신 수신
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'lint-empty-selection') {
        filterPanel.style.display = 'none';
        summaryBar.style.display = 'none';
        issueScrollArea.innerHTML = `
          <div class="empty-state-box">
            <div class="empty-icon-circle">
              <svg class="svg-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            </div>
            <div class="empty-state-title">검사할 대상을 선택하세요</div>
            <div class="empty-state-desc">
              피그마 캔버스에서 검증할 프레임을 클릭하면<br>
              버튼을 누르지 않아도 실시간으로 바로 검사합니다.
            </div>
          </div>
        `;
        return;
      }

      if (msg.type === 'lint-error') {
        filterPanel.style.display = 'none';
        summaryBar.style.display = 'none';
        issueScrollArea.innerHTML = `
          <div class="empty-state-box">
            <div class="empty-icon-circle">
              <svg class="svg-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            </div>
            <div class="empty-state-title">알림</div>
            <div class="empty-state-desc">${escapeHtml(msg.message)}</div>
          </div>
        `;
        return;
      }

      if (msg.type === 'lint-results') {
        const prevScroll = issueScrollArea.scrollTop;
        currentIssues = msg.issues || [];
        updateCounts();
        renderGroups();
        issueScrollArea.scrollTop = prevScroll;
      }
    };

    function updateCounts() {
      filterPanel.style.display = 'flex';
      summaryBar.style.display = 'flex';

      const mustFixCount = currentIssues.filter(i => i.severity === 'must-fix').length;
      const checkNeededCount = currentIssues.filter(i => i.severity === 'check-needed').length;

      pillAll.textContent = currentIssues.length;
      pillMustFix.textContent = mustFixCount;
      pillCheckNeeded.textContent = checkNeededCount;

      const fixableCount = currentIssues.filter(i => i.autoFixable).length;
      if (fixableCount > 0) {
        btnFixAll.style.display = 'inline-flex';
        cntFixableTotal.textContent = fixableCount;
        btnCloneAndFix.style.display = 'inline-flex';
      } else {
        btnFixAll.style.display = 'none';
        btnCloneAndFix.style.display = 'none';
      }

      summarySummaryText.textContent = `총 ${currentIssues.length}개 레이어 (${mustFixCount > 0 ? `수정 필요 ${mustFixCount}개` : ''}${mustFixCount > 0 && checkNeededCount > 0 ? ' · ' : ''}${checkNeededCount > 0 ? `확인 필요 ${checkNeededCount}개` : ''})`;
    }

    function buildGroups(issues) {
      const groupMap = new Map();

      issues.forEach(issue => {
        const key = issue.groupKey || issue.message;
        if (!groupMap.has(key)) {
          groupMap.set(key, {
            key,
            title: issue.groupTitle || issue.message,
            severity: issue.severity,
            category: issue.category,
            details: issue.details,
            autoFixable: issue.autoFixable,
            fixAction: issue.fixAction,
            items: []
          });
        }
        groupMap.get(key).items.push(issue);
      });

      return Array.from(groupMap.values());
    }

    function renderGroups() {
      if (currentIssues.length === 0) {
        issueScrollArea.innerHTML = `
          <div class="empty-state-box">
            <div class="empty-icon-circle success">
              <svg class="svg-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="empty-state-title">디자인시스템 규칙을 완벽히 준수하고 있습니다</div>
            <div class="empty-state-desc">
              선택한 영역에서 <b>[${currentMode === 'customer' ? '고객향' : '파트너향'}]</b> 규격 위반 사항이 전혀 없습니다.
            </div>
          </div>
        `;
        return;
      }

      const filteredIssues = currentIssues.filter(i => {
        if (currentSeverity !== 'all' && i.severity !== currentSeverity) return false;
        if (currentCategory !== 'all' && i.category !== currentCategory) return false;
        return true;
      });

      if (filteredIssues.length === 0) {
        issueScrollArea.innerHTML = `
          <div class="empty-state-box">
            <div class="empty-icon-circle">
              <svg class="svg-icon" style="width: 20px; height: 20px;" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <div class="empty-state-title">해당 조건에 해당하는 항목 없음</div>
            <div class="empty-state-desc">선택된 필터 조건에 해당하는 위반 사항이 없습니다.</div>
          </div>
        `;
        return;
      }

      const groups = buildGroups(filteredIssues);

      groups.sort((a, b) => {
        if (a.severity === 'must-fix' && b.severity !== 'must-fix') return -1;
        if (a.severity !== 'must-fix' && b.severity === 'must-fix') return 1;
        return b.items.length - a.items.length;
      });

      let html = '';

      groups.forEach(group => {
        const isExpanded = expandedGroupKeys.has(group.key);
        const fixableItems = group.items.filter(i => i.autoFixable);

        html += `
          <div class="group-card">
            <div class="group-header" onclick="toggleGroup('${escapeHtml(group.key)}')">
              <div class="group-info-left">
                <span class="badge-severity ${group.severity}">
                  ${group.severity === 'must-fix' ? '수정 필요' : '확인 필요'}
                </span>
                <span class="group-title" title="${escapeHtml(group.title)}">
                  ${escapeHtml(group.title)}
                </span>
                <span class="group-count-tag">${group.items.length}개 레이어</span>
              </div>
              <div class="group-actions-right" onclick="event.stopPropagation()">
                ${group.autoFixable && fixableItems.length > 0 ? `
                  <button class="btn-group-fix" onclick="fixGroup('${escapeHtml(group.key)}')">
                    <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span>${group.fixAction && group.fixAction.label ? group.fixAction.label : '일괄 수정'}</span>
                  </button>
                ` : ''}
                <button class="btn-chevron ${isExpanded ? 'expanded' : ''}" onclick="toggleGroup('${escapeHtml(group.key)}')">
                  <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
              </div>
            </div>

            ${isExpanded ? `
              <div class="group-items-list">
                ${group.items.map(item => `
                  <div class="layer-item-row">
                    <div class="layer-left">
                      <div class="layer-name-tag">${escapeHtml(item.nodeName)}</div>
                      <div class="layer-desc">${escapeHtml(item.details || item.message)}</div>
                    </div>
                    <div class="layer-btns">
                      <button class="btn-mini-locate" onclick="selectNode('${item.nodeId}')">
                        <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                        <span>위치 이동</span>
                      </button>
                      ${item.autoFixable ? `
                        <button class="btn-mini-fix" onclick="fixSingle('${item.nodeId}', '${item.id}')">
                          <span>수정</span>
                        </button>
                      ` : ''}
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      });

      issueScrollArea.innerHTML = html;
    }

    function toggleGroup(key) {
      if (expandedGroupKeys.has(key)) {
        expandedGroupKeys.delete(key);
      } else {
        expandedGroupKeys.add(key);
      }
      const prevScroll = issueScrollArea.scrollTop;
      renderGroups();
      issueScrollArea.scrollTop = prevScroll;
    }

    function selectNode(nodeId) {
      parent.postMessage({
        pluginMessage: {
          type: 'select-node',
          nodeId
        }
      }, '*');
    }

    function fixSingle(nodeId, issueId) {
      const issue = currentIssues.find(i => i.id === issueId);
      if (issue && issue.fixAction) {
        parent.postMessage({
          pluginMessage: {
            type: 'fix-issue',
            nodeId,
            fixAction: issue.fixAction
          }
        }, '*');
      }
    }

    function fixGroup(groupKey) {
      const itemsToFix = currentIssues.filter(i => (i.groupKey || i.message) === groupKey && i.autoFixable);
      if (itemsToFix.length === 0) return;

      parent.postMessage({
        pluginMessage: {
          type: 'fix-group',
          issues: itemsToFix
        }
      }, '*');
    }

    btnCloneAndFix.addEventListener('click', () => {
      parent.postMessage({
        pluginMessage: {
          type: 'clone-and-fix'
        }
      }, '*');
    });

    btnFixAll.addEventListener('click', () => {
      const fixable = currentIssues.filter(i => i.autoFixable);
      if (fixable.length === 0) return;

      if (confirm(`자동 보정 가능한 ${fixable.length}개 항목을 현재 레이어에서 일괄 수정하시겠습니까?\n(원본 보존을 원하시면 [완성본 복제 생성]을 사용하세요)`)) {
        parent.postMessage({
          pluginMessage: {
            type: 'fix-all',
            issues: fixable
          }
        }, '*');
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 초기 실행
    requestLint();
  </script>
</body>
</html>
